# Profilo di SVILUPPO - Configurazioni per ambiente dev

# Console H2 abilitata per debug
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurazione database H2 con file persistente
spring.datasource.url=jdbc:h2:file:./data/biblioteca-db-dev
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurazione JPA/Hibernate per sviluppo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging dettagliato per sviluppo
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
