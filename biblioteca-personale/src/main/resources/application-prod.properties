# Profilo di PRODUZIONE - Configurazioni per ambiente prod

# Console H2 DISABILITATA per sicurezza
spring.h2.console.enabled=false

# Configurazione database H2 con file persistente
spring.datasource.url=jdbc:h2:file:./data/biblioteca-db-prod
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurazione JPA/Hibernate per produzione
# ATTENZIONE: In produzione si consiglia di usare 'validate' o Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging minimale per produzione
logging.level.root=WARN
logging.level.it.ivano.biblioteca=INFO

# Sicurezza: nascondi informazioni sugli errori
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
