# Nome applicazione
spring.application.name=biblioteca-personale

# Profilo attivo di default (dev per sviluppo, prod per produzione)
# Per cambiare profilo: java -jar app.jar --spring.profiles.active=prod
spring.profiles.active=dev

# Configurazione database H2 con file persistente
spring.datasource.url=jdbc:h2:file:./data/biblioteca-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 - Configurata per profilo
# dev: abilitata, prod: disabilitata
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurazione JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
