<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title th:text="${libro.titolo} + ' — Biblioteca Personale'">Dettaglio libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .copertina-grande { max-width: 100%; border-radius: .75rem; box-shadow: 0 .5rem 1rem rgba(0,0,0,.2); }
        .copertina-grande-placeholder {
            height: 420px; border-radius: .75rem;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: linear-gradient(135deg, #6c757d 0%, #343a40 100%);
            color: #fff;
        }
    </style>
</head>

<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📚 Biblioteca</a>
        <div class="navbar-nav">
            <a class="nav-link text-white" th:href="@{/libri}">I miei libri</a>
        </div>
    </div>
</nav>

<main class="container py-4">

    <a class="btn btn-outline-secondary btn-sm mb-4" th:href="@{/libri}">
        <i class="bi bi-arrow-left me-1"></i>Torna alla biblioteca
    </a>

    <div class="row g-4">
        <!-- Copertina -->
        <div class="col-md-4 col-lg-3">
            <img th:if="${libro.isbn != null and !libro.isbn.isEmpty()}"
                 th:src="@{|https://covers.openlibrary.org/b/isbn/${libro.isbn}-L.jpg|}"
                 class="copertina-grande"
                 th:alt="${libro.titolo}"
                 onerror="sostituisciCopertina(this)">
            <div th:if="${libro.isbn == null or libro.isbn.isEmpty()}"
                 class="copertina-grande-placeholder">
                <i class="bi bi-book fs-1"></i>
                <small class="mt-2">Nessuna copertina</small>
            </div>
        </div>

        <!-- Informazioni -->
        <div class="col-md-8 col-lg-9">
            <h1 class="h2 mb-1" th:text="${libro.titolo}">Titolo</h1>
            <p class="fs-5 text-muted mb-3" th:text="${libro.autore}">Autore</p>

            <div class="mb-3">
                <span class="badge text-bg-info" th:text="${libro.categoria}">Categoria</span>
                <span class="badge"
                      th:classappend="${libro.statoLettura?.name() == 'LETTO'} ? 'text-bg-success' : (${libro.statoLettura?.name() == 'IN_LETTURA'} ? 'text-bg-warning' : (${libro.statoLettura?.name() == 'ABBANDONATO'} ? 'text-bg-danger' : 'text-bg-secondary'))"
                      th:text="${libro.statoLettura?.label}">Stato</span>
            </div>

            <!-- Stelle -->
            <div class="mb-3" th:if="${libro.valutazione != null}">
                <i th:each="i : ${#numbers.sequence(1, 5)}"
                   th:classappend="${i <= libro.valutazione} ? 'bi bi-star-fill text-warning fs-5' : 'bi bi-star text-muted fs-5'"></i>
            </div>

            <!-- Metadati -->
            <ul class="list-group list-group-flush mb-4">
                <li class="list-group-item px-0" th:if="${libro.isbn != null and !libro.isbn.isEmpty()}">
                    <i class="bi bi-upc me-2 text-muted"></i><strong>ISBN:</strong> <span th:text="${libro.isbn}"></span>
                </li>
                <li class="list-group-item px-0" th:if="${libro.annoPubblicazione != null}">
                    <i class="bi bi-calendar3 me-2 text-muted"></i><strong>Anno di pubblicazione:</strong> <span th:text="${libro.annoPubblicazione.year}"></span>
                </li>
                <li class="list-group-item px-0" th:if="${libro.dataInizioLettura != null}">
                    <i class="bi bi-play-circle me-2 text-muted"></i><strong>Iniziato il:</strong>
                    <span th:text="${#temporals.format(libro.dataInizioLettura, 'dd/MM/yyyy')}"></span>
                </li>
                <li class="list-group-item px-0" th:if="${libro.dataFineLettura != null}">
                    <i class="bi bi-flag me-2 text-muted"></i><strong>Finito il:</strong>
                    <span th:text="${#temporals.format(libro.dataFineLettura, 'dd/MM/yyyy')}"></span>
                    <span class="text-muted ms-1"
                          th:if="${libro.dataInizioLettura != null}"
                          th:text="'(' + ${T(java.time.temporal.ChronoUnit).DAYS.between(libro.dataInizioLettura, libro.dataFineLettura)} + ' giorni)'"></span>
                </li>
            </ul>

            <!-- Note -->
            <div class="card shadow-sm mb-4" th:if="${libro.note != null and !libro.note.isEmpty()}">
                <div class="card-header bg-white fw-bold">
                    <i class="bi bi-journal-text me-1"></i>Note personali
                </div>
                <div class="card-body">
                    <p class="card-text mb-0" style="white-space: pre-wrap;" th:text="${libro.note}"></p>
                </div>
            </div>

            <!-- Azioni -->
            <div class="d-flex gap-2">
                <a class="btn btn-warning" th:href="@{|/libri/modifica/${libro.id}|}">
                    <i class="bi bi-pencil-square me-1"></i>Modifica
                </a>
                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                    <i class="bi bi-trash me-1"></i>Elimina
                </button>
            </div>
        </div>
    </div>

    <!-- Modal di conferma eliminazione -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Conferma eliminazione</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
                </div>
                <div class="modal-body">
                    Sei sicuro di voler eliminare <strong th:text="${libro.titolo}">questo libro</strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                    <form th:action="@{|/libri/elimina/${libro.id}|}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger">Elimina</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // Sostituisce una copertina mancante con un placeholder grafico
    function sostituisciCopertina(img) {
        const div = document.createElement('div');
        div.className = 'copertina-grande-placeholder';
        div.innerHTML = '<i class="bi bi-book fs-1"></i><small class="mt-2">Nessuna copertina</small>';
        img.replaceWith(div);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
