<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestione Libro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container mt-5">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📚 Biblioteca</a>
        <div class="navbar-nav">
            <a class="nav-link text-white" th:href="@{/libri}">I miei libri</a>
        </div>
    </div>
</nav>
<div style="height: 3rem;"></div>
<h2 th:text="${libro.id} != null ? 'Modifica Libro' : 'Aggiungi Nuovo Libro'"></h2>
  <form th:object="${libro}" th:action="${libro.id} != null ? @{|/libri/modifica/${libro.id}|} : @{/libri/add}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
        <label for="titolo" class="form-label">Titolo</label>
        <input type="text" class=" form-control" id="titolo" th:field="*{titolo}" required>
    </div>
    <div class="mb-3">
        <label for="autore" class="form-label">Autore</label>
        <input type="text" class="form-control" id="autore" th:field="*{autore}" required>
    </div>
    <div class="mb-3">
        <label for="isbn" class="form-label">ISBN</label>
        <div class="input-group">
            <input type="text" class="form-control" id="isbn" th:field="*{isbn}">
            <button type="button" class="btn btn-outline-primary" onclick="recuperaDaIsbn()">
                <i class="bi bi-cloud-download"></i> Recupera da ISBN
            </button>
        </div>
        <small id="lookup-msg" class="form-text"></small>
    </div>
    <div class="mb-3">
        <label for="categoria" class="form-label">Categoria</label>
        <select class="form-control" id="categoria" th:field="*{categoria}">
            <option th:each="categoria : ${categorie}" th:value="${categoria}" th:text="${categoria}"></option>
        </select>
    </div>
    <div class="mb-3">
        <label for="annoPubblicazione" class="form-label">Anno di Pubblicazione</label>
        <input type="date" class="form-control" id="annoPubblicazione" th:field="*{annoPubblicazione}">
    </div>
    <div class="mb-3">
        <label for="statoLettura" class="form-label">Stato lettura</label>
        <select class="form-control" id="statoLettura" th:field="*{statoLettura}">
            <option th:each="stato : ${stati}" th:value="${stato}" th:text="${stato.label}"></option>
        </select>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="dataInizioLettura" class="form-label">Data inizio lettura</label>
            <input type="date" class="form-control" id="dataInizioLettura" th:field="*{dataInizioLettura}">
        </div>
        <div class="col-md-6 mb-3">
            <label for="dataFineLettura" class="form-label">Data fine lettura</label>
            <input type="date" class="form-control" id="dataFineLettura" th:field="*{dataFineLettura}">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="pagineAttuali" class="form-label">Pagine lette</label>
            <input type="number" class="form-control" id="pagineAttuali" th:field="*{pagineAttuali}" min="0" placeholder="es. 120">
        </div>
        <div class="col-md-6 mb-3">
            <label for="totalePagine" class="form-label">Pagine totali</label>
            <input type="number" class="form-control" id="totalePagine" th:field="*{totalePagine}" min="0" placeholder="es. 320">
        </div>
    </div>
    <div class="mb-3">
        <label for="valutazione" class="form-label">Valutazione</label>
        <select class="form-control" id="valutazione" th:field="*{valutazione}">
            <option value="">Nessuna valutazione</option>
            <option th:each="i : ${#numbers.sequence(1, 5)}"
                    th:value="${i}"
                    th:text="${i} + ' ' + ${i == 1 ? 'stella' : 'stelle'}"></option>
        </select>
    </div>
    <div class="mb-3">
        <label for="tagCsv" class="form-label">Tag</label>
        <input type="text" class="form-control" id="tagCsv" name="tagCsv"
               th:value="${#strings.listJoin(libro.tag.?[nome], ', ')}"
               placeholder="es. preferiti-2026, regalato, riletto">
        <small class="form-text text-muted">Separati da virgola. Vengono creati se non esistono.</small>
    </div>
    <div class="mb-3">
        <label for="note" class="form-label">Note</label>
        <textarea class="form-control" id="note" th:field="*{note}" rows="3" placeholder="Appunti, impressioni..."></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Salva</button>
    <a class="btn btn-secondary" th:href="@{/libri}">Annulla</a>
  </form>

<script>
    // Chiama il backend che interroga Open Library e compila titolo/autore/anno
    function recuperaDaIsbn() {
        const isbn = document.getElementById('isbn').value.trim();
        const msg = document.getElementById('lookup-msg');
        if (!isbn) {
            msg.textContent = 'Inserisci prima un ISBN.';
            msg.className = 'form-text text-danger';
            return;
        }
        msg.textContent = 'Ricerca in corso...';
        msg.className = 'form-text text-muted';
        fetch('/api/libri/lookup?isbn=' + encodeURIComponent(isbn))
            .then(r => {
                if (!r.ok) throw new Error('not found');
                return r.json();
            })
            .then(dati => {
                if (dati.titolo) document.getElementById('titolo').value = dati.titolo;
                if (dati.autore) document.getElementById('autore').value = dati.autore;
                if (dati.annoPubblicazione) document.getElementById('annoPubblicazione').value = dati.annoPubblicazione;
                msg.textContent = 'Dati recuperati da Open Library ✔';
                msg.className = 'form-text text-success';
            })
            .catch(() => {
                msg.textContent = 'Libro non trovato su Open Library per questo ISBN.';
                msg.className = 'form-text text-danger';
            });
    }
</script>

</body>
</html>
